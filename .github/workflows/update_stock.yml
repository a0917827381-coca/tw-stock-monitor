name: 每日台股資料更新

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載你的程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: pip install -r requirements.txt

      - name: 執行 Python 產生最新網頁
        run: python generate_html.py

      - name: 將最新的 index.html 存檔並上傳
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "機器人自動更新股價網頁" && git push)
